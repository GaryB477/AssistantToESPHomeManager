esphome:
  name: ac-infinity-proxy

esp32:
  board: dfrobot_firebeetle2_esp32e
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  manual_ip:
    static_ip: 192.168.0.211
    gateway: 192.168.0.254
    subnet: 255.255.255.0

# Plaintext API: this client speaks the unencrypted ESPHome protocol (no Noise support yet)
api:

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO

esp32_ble_tracker:

bluetooth_proxy:
  active: true
